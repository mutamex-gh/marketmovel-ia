{% extends "base.html" %}
{% block titulo %}Criar Conta — ImóvelIA{% endblock %}

{% block conteudo %}
<div class="w-full flex items-center justify-center px-4" style="height: calc(100vh - 48px); background: #000000; background-image: radial-gradient(ellipse 70% 70% at 50% 30%, rgba(0, 113, 227, 0.1), #000000); overflow: hidden;">
    <div class="w-full max-w-[390px] animate-scale-in">
        
        <!-- Clean Dark Card -->
        <div style="background: #141419; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); padding: 28px 26px;">
            
            <!-- Header -->
            <div class="text-center mb-5">
                <div style="width: 46px; height: 46px; background: #0071e3; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px;">
                    <svg style="width: 22px; height: 22px; color: #fff;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                </div>
                <h1 style="font-size: 1.375rem; font-weight: 700; color: #f5f5f7; letter-spacing: -0.03em; margin-bottom: 2px;">Criar sua conta</h1>
                <p style="color: rgba(255, 255, 255, 0.45); font-size: 0.75rem;">Cadastre-se para anunciar ou buscar imóveis</p>
            </div>

            <!-- Mensagem de Erro -->
            {% if erro %}
            <div style="padding: 8px 12px; background: rgba(255, 59, 48, 0.1); color: #ff453a; border: 1px solid rgba(255, 59, 48, 0.2); border-radius: 10px; font-size: 0.75rem; font-weight: 500; display: flex; align-items: center; gap: 6px; margin-bottom: 14px;">
                <svg style="width: 15px; height: 15px; flex-shrink: 0;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                {{ erro }}
            </div>
            {% endif %}

            <!-- Formulário -->
            <form action="/cadastro" method="post" class="space-y-3.5">
                <div>
                    <label for="nome" style="display: block; font-size: 0.75rem; font-weight: 500; color: rgba(255, 255, 255, 0.7); margin-bottom: 4px;">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required minlength="2"
                           placeholder="Seu nome completo"
                           style="width: 100%; padding: 9px 12px; background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; font-size: 0.8125rem; transition: border-color 0.15s; outline: none;"
                           onfocus="this.style.borderColor='#0071e3'"
                           onblur="this.style.borderColor='rgba(255, 255, 255, 0.1)'">
                </div>

                <div>
                    <label for="email" style="display: block; font-size: 0.75rem; font-weight: 500; color: rgba(255, 255, 255, 0.7); margin-bottom: 4px;">Endereço de Email</label>
                    <input type="email" id="email" name="email" required
                           placeholder="seu@email.com"
                           style="width: 100%; padding: 9px 12px; background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; font-size: 0.8125rem; transition: border-color 0.15s; outline: none;"
                           onfocus="this.style.borderColor='#0071e3'"
                           onblur="this.style.borderColor='rgba(255, 255, 255, 0.1)'">
                </div>

                <div>
                    <label for="telefone" style="display: block; font-size: 0.75rem; font-weight: 500; color: rgba(255, 255, 255, 0.7); margin-bottom: 4px;">Telefone (WhatsApp) <span style="color: #0071e3;">*</span></label>
                    <input type="text" id="telefone" name="telefone" required
                           placeholder="(49) 9 8837-9201" oninput="mascaraTelefone(this)"
                           style="width: 100%; padding: 9px 12px; background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; font-size: 0.8125rem; transition: border-color 0.15s; outline: none;"
                           onfocus="this.style.borderColor='#0071e3'"
                           onblur="this.style.borderColor='rgba(255, 255, 255, 0.1)'">
                </div>

                <div>
                    <label for="documento" style="display: block; font-size: 0.75rem; font-weight: 500; color: rgba(255, 255, 255, 0.7); margin-bottom: 4px;">Documento — CPF ou CNPJ <span style="color: rgba(255, 255, 255, 0.4); font-size: 0.6875rem;">(Opcional)</span></label>
                    <input type="text" id="documento" name="documento" oninput="mascaraDocumento(this)"
                           placeholder="000.000.000-00"
                           style="width: 100%; padding: 9px 12px; background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; font-size: 0.8125rem; transition: border-color 0.15s; outline: none;"
                           onfocus="this.style.borderColor='#0071e3'"
                           onblur="this.style.borderColor='rgba(255, 255, 255, 0.1)'">
                </div>

                <div>
                    <label for="senha" style="display: block; font-size: 0.75rem; font-weight: 500; color: rgba(255, 255, 255, 0.7); margin-bottom: 4px;">Senha de Acesso</label>
                    <input type="password" id="senha" name="senha" required minlength="6"
                           placeholder="Mínimo 6 caracteres"
                           style="width: 100%; padding: 9px 12px; background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; font-size: 0.8125rem; transition: border-color 0.15s; outline: none;"
                           onfocus="this.style.borderColor='#0071e3'"
                           onblur="this.style.borderColor='rgba(255, 255, 255, 0.1)'">
                </div>

                <div>
                    <label for="tipo_usuario" style="display: block; font-size: 0.75rem; font-weight: 500; color: rgba(255, 255, 255, 0.7); margin-bottom: 4px;">Tipo de Conta</label>
                    <select id="tipo_usuario" name="tipo_usuario"
                            style="width: 100%; padding: 9px 12px; background: #1c1c22; color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; font-size: 0.8125rem; transition: border-color 0.15s; outline: none;"
                            onfocus="this.style.borderColor='#0071e3'"
                            onblur="this.style.borderColor='rgba(255, 255, 255, 0.1)'">
                        {% if tipos_usuario %}
                            {% for tipo in tipos_usuario %}
                            <option value="{{ tipo.slug }}" style="background: #1c1c22; color: #fff;">{{ tipo.nome }}</option>
                            {% endfor %}
                        {% else %}
                            <option value="proprietario" style="background: #1c1c22; color: #fff;">Proprietário</option>
                            <option value="corretor" style="background: #1c1c22; color: #fff;">Corretor</option>
                            <option value="imobiliaria" style="background: #1c1c22; color: #fff;">Imobiliária</option>
                        {% endif %}
                    </select>
                </div>

                <button type="submit"
                    style="width: 100%; padding: 12px; margin-top: 20px; background: #0071e3; color: #fff; font-weight: 600; font-size: 0.875rem; border-radius: 10px; border: none; cursor: pointer; transition: background 0.15s;"
                    onmouseover="this.style.background='#0077ed'"
                    onmouseout="this.style.background='#0071e3'">
                    Criar Minha Conta
                </button>
            </form>

            <!-- Footer Link -->
            <p style="text-align: center; font-size: 0.75rem; color: rgba(255, 255, 255, 0.45); margin-top: 16px;">
                Já possui uma conta criada?
                <a href="/login" style="color: #2997ff; font-weight: 500; text-decoration: none; margin-left: 3px;"
                   onmouseover="this.style.textDecoration='underline'"
                   onmouseout="this.style.textDecoration='none'">Fazer login</a>
            </p>

        </div>

    </div>
</div>
{% endblock %}

{% block footer %}{% endblock %}
