{% extends "base.html" %}
{% block titulo %}Criar Conta — ImóvelIA{% endblock %}

{% block conteudo %}
<div class="min-h-[calc(100vh-200px)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm animate-scale-in">
        <!-- Card -->
        <div class="section-card p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <div style="width: 52px; height: 52px; background: linear-gradient(145deg, var(--apple-green), #30b350); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 4px 16px rgba(52, 199, 89, 0.2);">
                    <svg style="width: 26px; height: 26px; color: #fff;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                </div>
                <h1 style="font-size: 1.375rem; font-weight: 700; color: var(--apple-text-primary); letter-spacing: -0.03em;">Criar sua conta</h1>
                <p style="color: var(--apple-text-tertiary); font-size: 0.8125rem; margin-top: 4px;">Cadastre-se para anunciar ou buscar imóveis</p>
            </div>

            <!-- Erro -->
            {% if erro %}
            <div class="alert-apple error mb-6">
                <svg style="width: 18px; height: 18px; flex-shrink: 0;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                {{ erro }}
            </div>
            {% endif %}

            <!-- Formulário -->
            <form action="/cadastro" method="post" class="space-y-4">
                <div>
                    <label for="nome" style="display: block; font-size: 0.8125rem; font-weight: 500; color: var(--apple-text-primary); margin-bottom: 6px;">Nome completo</label>
                    <input type="text" id="nome" name="nome" required minlength="2"
                           placeholder="Seu nome"
                           class="input-apple">
                </div>
                <div>
                    <label for="email" style="display: block; font-size: 0.8125rem; font-weight: 500; color: var(--apple-text-primary); margin-bottom: 6px;">Email</label>
                    <input type="email" id="email" name="email" required
                           placeholder="seu@email.com"
                           class="input-apple">
                </div>
                <div>
                    <label for="senha" style="display: block; font-size: 0.8125rem; font-weight: 500; color: var(--apple-text-primary); margin-bottom: 6px;">Senha</label>
                    <input type="password" id="senha" name="senha" required minlength="6"
                           placeholder="Mínimo 6 caracteres"
                           class="input-apple">
                </div>
                <div>
                    <label for="tipo_usuario" style="display: block; font-size: 0.8125rem; font-weight: 500; color: var(--apple-text-primary); margin-bottom: 6px;">Tipo de conta</label>
                    <select id="tipo_usuario" name="tipo_usuario" class="input-apple">
                        <option value="proprietario">Proprietário direto</option>
                        <option value="corretor">Corretor</option>
                        <option value="imobiliaria">Imobiliária</option>
                    </select>
                </div>
                <button type="submit" class="btn-filled w-full" style="padding: 12px; border-radius: 12px; font-size: 0.9375rem; background: var(--apple-green);"
                    onmouseover="this.style.background='#30b350'" onmouseout="this.style.background='var(--apple-green)'">
                    Criar Conta
                </button>
            </form>

            <!-- Link para login -->
            <p style="text-align: center; font-size: 0.8125rem; color: var(--apple-text-tertiary); margin-top: 24px;">
                Já tem conta?
                <a href="/login" style="color: var(--apple-blue); font-weight: 500; text-decoration: none;">Fazer login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
