{% extends "base.html" %}
{% block titulo %}Criar Conta — ImóvelIA{% endblock %}

{% block conteudo %}
<div class="min-h-[calc(100vh-200px)] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
        <!-- Card -->
        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-gradient-to-br from-accent-500 to-accent-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-accent-500/25">
                    <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Criar sua conta</h1>
                <p class="text-slate-500 mt-1 text-sm">Cadastre-se para anunciar ou buscar imóveis</p>
            </div>

            <!-- Erro -->
            {% if erro %}
            <div class="mb-6 p-3 bg-red-50 text-red-600 rounded-xl text-sm font-medium flex items-center gap-2">
                <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                {{ erro }}
            </div>
            {% endif %}

            <!-- Formulário -->
            <form action="/cadastro" method="post" class="space-y-5">
                <div>
                    <label for="nome" class="block text-sm font-medium text-slate-700 mb-1.5">Nome completo</label>
                    <input type="text" id="nome" name="nome" required minlength="2"
                           placeholder="Seu nome"
                           class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:border-primary-500 transition-colors bg-slate-50 focus:bg-white">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email</label>
                    <input type="email" id="email" name="email" required
                           placeholder="seu@email.com"
                           class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:border-primary-500 transition-colors bg-slate-50 focus:bg-white">
                </div>
                <div>
                    <label for="senha" class="block text-sm font-medium text-slate-700 mb-1.5">Senha</label>
                    <input type="password" id="senha" name="senha" required minlength="6"
                           placeholder="Mínimo 6 caracteres"
                           class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:border-primary-500 transition-colors bg-slate-50 focus:bg-white">
                </div>
                <div>
                    <label for="tipo_usuario" class="block text-sm font-medium text-slate-700 mb-1.5">Tipo de conta</label>
                    <select id="tipo_usuario" name="tipo_usuario"
                            class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:border-primary-500 transition-colors bg-slate-50 focus:bg-white">
                        <option value="proprietario">Proprietário direto</option>
                        <option value="corretor">Corretor</option>
                        <option value="imobiliaria">Imobiliária</option>
                    </select>
                </div>
                <button type="submit"
                        class="w-full py-3 bg-accent-500 hover:bg-accent-600 text-white font-semibold rounded-xl transition-colors shadow-lg shadow-accent-500/25">
                    Criar Conta
                </button>
            </form>

            <!-- Link para login -->
            <p class="text-center text-sm text-slate-500 mt-6">
                Já tem conta?
                <a href="/login" class="text-primary-600 hover:text-primary-700 font-medium">Fazer login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
